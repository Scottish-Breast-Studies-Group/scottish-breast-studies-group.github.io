- label: Next webinar
  title: "HER2-RADiCAL: less treatment after a complete response?"
  when: "Friday 6 November 2026, 13:10 to 13:40, Microsoft Teams"
  summary: >-
    Professor Iain MacPherson (University of Glasgow) describes HER2-RADiCAL, a UK trial
    testing whether people with HER2-positive early breast cancer who respond completely
    to treatment before surgery can safely receive less treatment afterwards. Chaired by
    Dr Caroline Michie (Edinburgh Cancer Centre).
  link_text: Register for the webinar
  link_url: "https://events.teams.microsoft.com/event/f4a386b4-d137-49c2-8d27-1d7ae09224f0@2e9f06b0-1669-4589-8789-10a06934dc61?source=copyLinkOneEventsShareDialog"
  second_link_text: Full webinar programme
  second_link_url: /webinars/
  show_until: 2026-11-06

- label: Watch again
  title: "CESAR trial update: contrast-enhanced mammography versus MRI"
  when: "Recorded 5 October 2026"
  summary: >-
    Dr Sarah Savaridas reports progress on CESAR, which compares contrast-enhanced
    mammography with MRI for assessing response to neoadjuvant chemotherapy, and
    discusses with Professor Gerald Lip where the technique adds most value in Scotland.
  link_text: Watch the recording
  link_url: "https://youtu.be/NgvrYJFyBss"
  second_link_text: All recordings
  second_link_url: /webinars/#archive
  show_until: 2027-01-31

- label: Survey
  title: "PRIORITY-BC: help shape the next breast cancer trials"
  when: "Closes Monday 9 November 2026"
  summary: >-
    The UK Breast Cancer Clinical Studies Group and partners ask clinicians who treat early
    breast cancer which questions the next three or four NIHR-funded UK trials should
    answer. The survey takes a few minutes.
  link_text: Take the survey
  link_url: "https://www.surveymonkey.com/r/prioritybc"
  show_until: 2026-11-09

- label: Conference
  title: "EBCSS 2027: Edinburgh Breast Cancer Special Symposium"
  when: "Thursday 25 and Friday 26 February 2027, Edinburgh International Conference Centre"
  summary: >-
    The Edinburgh Breast Cancer Special Symposium takes place in Edinburgh in February 2027, with more
    than 30 keynote lectures across 12 themes from speakers including Lisa Carey, Judy
    Boughey, Giuseppe Curigliano, Fatima Cardoso and David Cameron. A public lecture and
    panel discussion on breast cancer takes place on Wednesday 24 February at 16:30.
  highlight: "Early-bird registration closes at 17:00 on Monday 5 October 2026."
  highlight_until: 2026-10-05
  link_text: Tickets and programme at ebcss.org
